name: Update GitAscii

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: gitascii-publication
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clear GitHub Actions cache (gitascii)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Clearing GitHub Actions caches for gitascii..."
          # Delete all caches that contain gitascii in key (if any)
          gh cache list --json key,id 2>/dev/null | jq -r '.[] | select(.key | contains("gitascii")) | .id' | while read -r id; do
            echo " → deleting cache $id"
            gh cache delete "$id" --confirm 2>/dev/null || true
          done
          # Fallback: delete all caches if no gitascii-specific cache found (ensures fresh run)
          # gh cache delete --all --confirm 2>/dev/null || true
          echo "✓ Cache clear done"
          gh cache list --json key,id 2>/dev/null | head -n 20 || true

      - name: Generate and Publish GitAscii SVGs
        uses: Igorcbraz/GitAscii/action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
