name: Clear GitHub Actions Cache

on:
  push:
    branches: [main]

permissions:
  actions: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Clear all GitHub Actions caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Clearing all GitHub Actions caches on push to main..."
          # List and delete all caches (GitAscii + snake + others)
          gh cache list --json key,id 2>/dev/null | jq -r '.[].id' | while read -r id; do
            [ -n "$id" ] && echo " → deleting cache $id" && gh cache delete "$id" --confirm 2>/dev/null || true
          done
          echo "✓ All caches cleared (or none existed)"
          gh cache list --json key 2>/dev/null | head -n 20 || echo "No caches remaining"
